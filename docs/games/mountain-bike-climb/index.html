<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mountain Bike Climb</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1d33; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; top: 14px; left: 18px; color: #fff; text-shadow: 0 1px 3px #000; font-size: 17px; letter-spacing: 0.3px; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
         color: #fff; text-shadow: 0 2px 8px #000; text-align: center; pointer-events: none; }
  #msg h1 { font-size: 52px; margin: 0 0 10px; }
  #msg p { margin: 5px; font-size: 19px; opacity: 0.95; }
  #msg .kbd { display: inline-block; padding: 1px 8px; border: 1px solid rgba(255,255,255,.6); border-radius: 5px; font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg"></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), msg = document.getElementById('msg');
let W = 0, H = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// ---- tuning ----
const G = 1500, ACCEL = 620, DRAG = 0.6, MAXV = 560, JUMP = 560, STEP = 26, SPIN = 6.8;

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('click', () => { if (state !== 'play') start(); });

let pts = [], gen, bike, cam, state = 'menu', flips = 0, pops = [], gapEdgeY = 0;
let best = +localStorage.getItem('mbc_best') || 0;

// ---- terrain generation ----
function ensureTerrain(uptoX) {
  while (pts.length * STEP < uptoX) {
    const i = pts.length, x = i * STEP;
    if (gen.gapLeft > 0) {
      pts.push({ x, y: gen.y, gap: true });
      gen.gapLeft--;
      if (gen.gapLeft === 0) {
        gen.y += -25 + Math.random() * 75;          // far side roughly level or a bit lower
        gen.gapCd = 22 + Math.floor(Math.random() * 28);
        gen.slope = -0.05;
      }
      continue;
    }
    if (gen.rampLeft === 0 && i > 30) {
      gen.gapCd--;
      if (gen.gapCd <= 0) { gen.rampLeft = 5; gen.gapCd = 1e9; }
    }
    if (gen.rampLeft > 0) {
      gen.rampLeft--;
      gen.slope = -0.5;
      gen.y += gen.slope * STEP;
      pts.push({ x, y: gen.y, gap: false });
      if (gen.rampLeft === 0) gen.gapLeft = 3 + Math.min(5, Math.floor(x / 8000)) + (Math.random() < 0.3 ? 1 : 0);
      continue;
    }
    gen.slope += (Math.random() - 0.5) * 0.13;
    gen.slope += (-0.2 - gen.slope) * 0.05;           // drift back to a gentle climb
    gen.slope = Math.max(-0.8, Math.min(0.3, gen.slope));
    gen.y += gen.slope * STEP;
    pts.push({ x, y: gen.y, gap: false });
  }
}
function seg(x) {
  const i = Math.floor(x / STEP);
  if (i < 0 || i >= pts.length - 1) return null;
  const p0 = pts[i], p1 = pts[i + 1];
  if (p0.gap || p1.gap) return null;
  return { p0, p1, t: (x - p0.x) / STEP };
}
function groundAt(x) { const s = seg(x); return s ? s.p0.y + (s.p1.y - s.p0.y) * s.t : null; }
function slopeAt(x) { const s = seg(x); return s ? Math.atan2(s.p1.y - s.p0.y, STEP) : 0; }

// ---- game state ----
function reset() {
  pts = [];
  gen = { y: 0, slope: -0.05, gapCd: 40, gapLeft: 0, rampLeft: 0 };
  ensureTerrain(4000);
  const sx = 200, sy = groundAt(sx);
  bike = { x: sx, y: sy, vx: 0, vy: 0, angle: slopeAt(sx), speed: 40, onGround: true, spin: 0, startY: sy, startX: sx };
  cam = { x: bike.x - W * 0.3, y: bike.y - H * 0.62 };
  flips = 0; pops = [];
}
function start() {
  reset();
  state = 'play';
  msg.style.display = 'none';
}
function crash(reason) {
  state = 'dead';
  const alt = Math.max(0, Math.round((bike.startY - bike.y) / 10));
  const dist = Math.round((bike.x - bike.startX) / 10);
  const isBest = alt > best;
  if (isBest) { best = alt; localStorage.setItem('mbc_best', best); }
  msg.style.display = 'flex';
  msg.innerHTML =
    `<h1>💥 ${reason}</h1>` +
    `<p>Climbed <b>${alt} m</b> · Distance <b>${dist} m</b> · Flips <b>${flips}</b></p>` +
    `<p>${isBest ? '🏆 New best altitude!' : 'Best altitude: ' + best + ' m'}</p>` +
    `<p>Press <span class="kbd">Space</span> to ride again</p>`;
}
function showMenu() {
  msg.style.display = 'flex';
  msg.innerHTML =
    `<h1>🚵 Mountain Bike Climb</h1>` +
    `<p>Hold <span class="kbd">→</span> to pedal up the mountain · <span class="kbd">Space</span> to jump</p>` +
    `<p>In the air, <span class="kbd">←</span> <span class="kbd">→</span> spin for flips (land wheels-down!)</p>` +
    `<p>Clear the ravines. Climb as high as you can.</p>` +
    `<p>Press <span class="kbd">Space</span> to start</p>`;
}

// ---- physics ----
function update(dt) {
  const b = bike;
  if (b.onGround) {
    const a = slopeAt(b.x);
    if (keys.ArrowRight || keys.KeyD) b.speed += ACCEL * dt;
    if (keys.ArrowLeft || keys.KeyA || keys.ArrowDown || keys.KeyS) b.speed -= ACCEL * 0.7 * dt;
    b.speed += G * Math.sin(a) * dt;        // gravity along the slope
    b.speed -= b.speed * DRAG * dt;
    b.speed = Math.max(-300, Math.min(MAXV, b.speed));
    b.x += b.speed * Math.cos(a) * dt;
    const g2 = groundAt(b.x);
    if (g2 === null) {                        // rode off a cliff
      b.onGround = false;
      b.vx = b.speed * Math.cos(a); b.vy = b.speed * Math.sin(a);
      gapEdgeY = b.y; b.spin = 0;
    } else {
      b.y = g2;
      b.angle += (a - b.angle) * Math.min(1, dt * 14);
      if (keys.Space || keys.ArrowUp || keys.KeyW) {
        keys.Space = keys.ArrowUp = keys.KeyW = false;
        b.onGround = false;
        b.vx = b.speed * Math.cos(a);
        b.vy = b.speed * Math.sin(a) - JUMP;
        gapEdgeY = b.y; b.spin = 0;
      }
    }
  } else {
    b.vy += G * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    let s = 0;
    if (keys.ArrowLeft || keys.KeyA) s = -1;
    if (keys.ArrowRight || keys.KeyD) s = 1;
    b.angle += s * SPIN * dt;
    b.spin += s * SPIN * dt;
    const g2 = groundAt(b.x);
    if (g2 !== null && b.y >= g2) {
      const a = slopeAt(b.x);
      let d = ((((b.angle - a) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
      if (Math.abs(d) > 1.2) { crash('Landed on your head'); return; }
      const f = Math.round(Math.abs(b.spin) / (2 * Math.PI));
      if (f > 0) {
        flips += f;
        pops.push({ x: b.x, y: b.y - 50, t: 1.2, txt: f > 1 ? `${f}x FLIP!` : 'FLIP!' });
      }
      b.onGround = true;
      b.y = g2;
      b.angle = a + d * 0.25;
      b.speed = Math.max(-300, Math.min(MAXV, b.vx * Math.cos(a) + b.vy * Math.sin(a) * 0.4));
    } else if (g2 === null && b.y > gapEdgeY + 320) {
      crash('Fell into a ravine'); return;
    }
  }
  cam.x += (b.x - W * 0.32 - cam.x) * Math.min(1, dt * 5);
  cam.y += (b.y - H * 0.64 - cam.y) * Math.min(1, dt * 4);
  ensureTerrain(b.x + W + 600);
  for (const p of pops) { p.t -= dt; p.y -= 40 * dt; }
  pops = pops.filter(p => p.t > 0);
}

// ---- rendering ----
function lerpColor(c1, c2, t) {
  return `rgb(${Math.round(c1[0] + (c2[0] - c1[0]) * t)},${Math.round(c1[1] + (c2[1] - c1[1]) * t)},${Math.round(c1[2] + (c2[2] - c1[2]) * t)})`;
}
function drawMountains(par, color, base, amp, freq) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) {
    const wx = x + cam.x * par;
    const y = base - cam.y * par * 0.15
      + Math.sin(wx * freq) * amp
      + Math.sin(wx * freq * 2.7 + 1.3) * amp * 0.4
      + Math.sin(wx * freq * 0.35 + 4) * amp * 0.7;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();
}
let stars = [];
for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.4 + 0.3 });

function draw() {
  const b = bike;
  const alt = Math.max(0, (b.startY - b.y) / 10);
  const t = Math.min(1, alt / 1400);

  // sky
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, lerpColor([70, 130, 210], [8, 10, 32], t));
  grd.addColorStop(1, lerpColor([195, 225, 255], [70, 80, 130], t));
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);
  // stars fade in with altitude
  if (t > 0.15) {
    ctx.fillStyle = `rgba(255,255,255,${(t - 0.15) * 1.1})`;
    for (const s of stars) { ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill(); }
  }
  // parallax ridges
  drawMountains(0.12, lerpColor([120, 150, 200], [40, 45, 80], t), H * 0.5, 90, 0.004);
  drawMountains(0.3, lerpColor([80, 105, 150], [28, 32, 60], t), H * 0.68, 70, 0.006);

  // terrain
  const startI = Math.max(0, Math.floor(cam.x / STEP));
  const endI = Math.min(pts.length - 1, Math.ceil((cam.x + W) / STEP) + 1);
  const grassColor = lerpColor([120, 190, 80], [235, 245, 255], t);   // grass -> snow
  const rock = ctx.createLinearGradient(0, 0, 0, H);
  rock.addColorStop(0, lerpColor([70, 90, 60], [110, 118, 135], t));
  rock.addColorStop(1, '#241a14');
  let run = [];
  const flush = () => {
    if (run.length < 2) { run = []; return; }
    ctx.beginPath();
    ctx.moveTo(run[0].x - cam.x, run[0].y - cam.y);
    for (const p of run) ctx.lineTo(p.x - cam.x, p.y - cam.y);
    ctx.lineTo(run[run.length - 1].x - cam.x, H + 20);
    ctx.lineTo(run[0].x - cam.x, H + 20);
    ctx.closePath();
    ctx.fillStyle = rock; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(run[0].x - cam.x, run[0].y - cam.y);
    for (const p of run) ctx.lineTo(p.x - cam.x, p.y - cam.y);
    ctx.strokeStyle = grassColor; ctx.lineWidth = 6; ctx.stroke();
    run = [];
  };
  for (let i = startI; i <= endI; i++) {
    if (pts[i].gap) flush(); else run.push(pts[i]);
  }
  flush();

  // bike
  ctx.save();
  ctx.translate(b.x - cam.x, b.y - cam.y);
  ctx.rotate(b.angle);
  const wr = 10;
  for (const wx of [-14, 14]) {
    ctx.beginPath(); ctx.arc(wx, -wr, wr, 0, 7);
    ctx.fillStyle = '#222'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.translate(wx, -wr); ctx.rotate(b.x / wr);
    ctx.strokeStyle = '#9aa'; ctx.lineWidth = 1.4; ctx.beginPath();
    for (let k = 0; k < 3; k++) {
      const an = k * Math.PI / 3;
      ctx.moveTo(-wr * Math.cos(an) * 0.8, -wr * Math.sin(an) * 0.8);
      ctx.lineTo(wr * Math.cos(an) * 0.8, wr * Math.sin(an) * 0.8);
    }
    ctx.stroke(); ctx.restore();
  }
  // frame
  ctx.strokeStyle = '#e6402e'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-14, -10); ctx.lineTo(-2, -22); ctx.lineTo(10, -10);
  ctx.moveTo(-2, -22); ctx.lineTo(14, -10);
  ctx.moveTo(6, -22); ctx.lineTo(14, -10);
  ctx.stroke();
  // rider
  ctx.strokeStyle = '#1d2b3a'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(-4, -22); ctx.lineTo(0, -36); ctx.lineTo(8, -26);
  ctx.moveTo(0, -36); ctx.lineTo(-6, -46);
  ctx.stroke();
  ctx.fillStyle = '#ffd240'; ctx.beginPath(); ctx.arc(-6, -52, 6.5, 0, 7); ctx.fill();
  ctx.restore();

  // flip popups
  ctx.textAlign = 'center';
  for (const p of pops) {
    ctx.font = 'bold 26px system-ui';
    ctx.fillStyle = `rgba(255,220,80,${Math.min(1, p.t)})`;
    ctx.strokeStyle = `rgba(0,0,0,${Math.min(1, p.t) * 0.6})`; ctx.lineWidth = 4;
    ctx.strokeText(p.txt, p.x - cam.x, p.y - cam.y);
    ctx.fillText(p.txt, p.x - cam.x, p.y - cam.y);
  }
  ctx.textAlign = 'left';

  hud.textContent = `⛰ ${Math.round(alt)} m   ↔ ${Math.round((b.x - b.startX) / 10)} m   🌀 ${flips} flips   🏆 best ${best} m`;
}

// ---- main loop ----
let last = 0, acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(50, ts - (last || ts)) / 1000; last = ts;
  if (state === 'play') {
    acc += dt;
    while (acc > 1 / 120) { update(1 / 120); acc -= 1 / 120; if (state !== 'play') break; }
  }
  draw();
}
reset();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
